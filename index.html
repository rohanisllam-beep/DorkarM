 so_submit:async(targetShopId)=>{
   const name=val('o_name').trim(),phone=val('o_phone').trim(),addr=val('o_addr').trim(),notes=val('o_notes').trim();
   if(name.length<2)return toast('আপনার নাম লিখুন');
   const cleanPhone=phone.replace(/[\s-]/g,'').replace(/^(\+?88)/,'');
   if(!/^01[3-9]\d{8}$/.test(cleanPhone))return toast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)');
   if(addr.length<5)return toast('সম্পূর্ণ ডেলিভারি ঠিকানা দিন');

   const s=by(targetShopId)||by(1);
   const lines=[];
   for(const [key, qty] of Object.entries(cart)){
     const [sid, j] = key.split(':');
     const store = by(sid);
     if(store && store.m[j]){
       lines.push({ pid: key, n: store.m[j][0], q: qty, p: store.m[j][1], sample: false });
     }
   }

   const deliveryCharge = 60;
   const subtotal = sub();
   const total = subtotal + deliveryCharge;
   const orderId = 'DKR-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(1000 + Math.random()*9000);

   toast('অর্ডার পাঠানো হচ্ছে…');
   try {
     const res = await fetch('/api/orders', {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({
         id: orderId,
         customerName: name,
         phone: cleanPhone,
         address: addr,
         notes: notes,
         preferredStore: s.b,
         category: s.cb,
         businessId: s.id,
         lines: lines,
         subtotal: subtotal,
         deliveryCharge: deliveryCharge,
         total: total
       })
     });
     const data = await res.json();
     if(data.success){
       cart={}; sv('dk-cart', cart); render();
       sheet(`<div class="ck">${ic('check')}</div><h4>অর্ডার সফল হয়েছে!</h4><p class="p">অর্ডার আইডি: <b>#${orderId}</b><br>দোকান: ${s.b}<br>মোট প্রদেয়: <b>${tk(total)}</b> (ক্যাশ অন ডেলিভারি)<br><br>আমাদের টিম শীঘ্রই আপনার সাথে যোগাযোগ করবে।</p><button class="btn" data-a="d">কেনাকাটা চালিয়ে যান</button>`, 1);
       return;
     }
   } catch(err) {
     console.error('Order submission error:', err);
   }

   cart={}; sv('dk-cart', cart); render();
   sheet(`<div class="ck">${ic('check')}</div><h4>অর্ডার সফল হয়েছে!</h4><p class="p">অর্ডার আইডি: <b>#${orderId}</b><br>দোকান: ${s.b}<br>আমাদের টিম শীঘ্রই যোগাযোগ করবে।</p><button class="btn" data-a="d">কেনাকাটা চালিয়ে যান</button>`, 1);
 },
