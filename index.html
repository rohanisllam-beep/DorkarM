 return{on:!!FBC,
  async create(o,n){const{F,db}=await load();await Promise.race([F.setDoc(F.doc(db,'orders',o.id),o),tmo(15000)]);F.setDoc(F.doc(db,'notifications',n.id),n).catch(e=>console.warn('notification not saved',e));return o},
  async get(id){const{F,db}=await load();const s=await Promise.race([F.getDoc(F.doc(db,'orders',id)),tmo(12000)]);return s.exists()?s.data():null},
  async sub(id,cb){const{F,db}=await load();return F.onSnapshot(F.doc(db,'orders',id),s=>cb(s.exists()?s.data():null),e=>cb(undefined,e))}}})();

 if(pr&&!/^\d{1,5}$/.test(pr)){$('#sppe').textContent='Use numbers only (up to 99999)';bad=1}
 if(bad)return;const old=ST.ed.id&&d.dr.ps.find(x=>x.id==ST.ed.id);
 const o={id:ST.ed.id||'new-'+Date.now().toString(36),n,p:pr?+pr:null,d:$('#spd').value.trim(),c:$('#spc').value,a:ST.ed.a,img:ST.ed.img,ex:old?old.ex:false};
 if(old)d.dr.ps[d.dr.ps.indexOf(old)]=o;else d.dr.ps.push(o);closeAll();stRender();toast('Saved to draft — not applied yet')}
function stDel(id){const d=stData(ST.shop),i=d.dr.ps.findIndex(x=>x.id==id);if(i<0)return;const[p]=d.dr.ps.splice(i,1);stRender();toast('Removed from draft','Undo',()=>{d.dr.ps.splice(Math.min(i,d.dr.ps.length),0,p);stRender()})}
function stPrev(){const b=stShop(),d=stData(b.id),dr=d.dr,ch=stDiff(d),p=stPal(b,dr.ban);sheet.setAttribute('aria-label','Preview changes');
 sheet.innerHTML=`<div class="ph"><div style="flex:1;min-width:0"><h2 class="bn">Preview changes</h2><div class="sub">Storefront preview of your draft · not live</div></div><button class="ib sm" data-close aria-label="Close">${ic('x',18)}</button></div>
<div class="st-pv">${stBanner(b,dr)}<h3 class="bn">${esc(b.n)}</h3><div class="sub">${esc(b.c)} · ${esc(b.l)}</div>${dr.desc?`<p class="st-desc">${esc(dr.desc)}</p>`:''}<div class="st-pg ${dr.lay=='list'?'list':''}">${dr.ps.map(x=>stTile(x,b)).join('')||'<p class="note">No products</p>'}</div></div>
<div class="fld"><label>Changes (${ch.length})</label>${ch.length?`<ul class="st-ul">${ch.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'<p class="sub">No changes compared with the applied demo state.</p>'}</div>
<div class="rule">${ic('info',16)}<span>Applying updates this browser tab's demo state only. Nothing is saved permanently or published to the live website.</span></div>
<button class="pill full" data-st-apply ${ch.length?'':'disabled'}>Apply to demo state</button><button class="gbt rx-sec" data-st-discard ${ch.length?'':'disabled'}>Discard draft changes</button>`;showLayer(sheet)}

/* ---------- events (delegated; all attributes are data-rx-* / data-st-*) ---------- */
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.rxf!==undefined){const k=t.dataset.rxf;if(k=='ack')RX.f.ack=t.checked;else if(k=='note')RX.f.note=t.value;else if(RX.f.meds[+t.dataset.i])RX.f.meds[+t.dataset.i][k]=t.value;rxRefresh()}
 else if(t.dataset.stf=='desc'){const d=stData(ST.shop);d.dr.desc=t.value;const c=$('#stcc'),p=$('#stapdesc');if(c)c.textContent=t.value.length;if(p)p.textContent=t.value||'No description yet.';stCount()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='rxfile')rxPickFile(t);
 else if(t.id=='spimg'){const f=t.files&&t.files[0];t.value='';if(!f)return;if(!f.type.startsWith('image/')){$('#spie').textContent='Please choose an image';return}$('#spie').textContent='';ST.ed.img=URL.createObjectURL(f);$('#spib').innerHTML=stImgBox()}
 else if(t.dataset&&t.dataset.rxf=='ack'){RX.f.ack=t.checked;rxRefresh()}});
document.addEventListener('click',e=>{const t=e.target;let x;
 if(x=t.closest('[data-rx-ph]')){RX.f.ph=+x.dataset.rxPh;x.parentNode.querySelectorAll('button').forEach(b=>{const on=b==x;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});$('#rxphi').innerHTML=rxPhInfo();rxRefresh();return}
 if(t.closest('[data-rx-pick]')){$('#rxfile').click();return}
 if(t.closest('[data-rx-rm]')){rxDrop();RX.f.file=null;$('#rxfb').innerHTML=rxFileBox();rxRefresh();return}
 if(t.closest('[data-rx-addmed]')){if(RX.f.meds.length<10){RX.f.meds.push({n:'',d:'',q:''});$('#rxmeds').innerHTML=rxMedRows();$('#rxn'+(RX.f.meds.length-1)).focus({preventScroll:true});rxRefresh()}return}
 if(x=t.closest('[data-rx-delmed]')){RX.f.meds.splice(+x.dataset.rxDelmed,1);$('#rxmeds').innerHTML=rxMedRows();rxRefresh();return}
 if(t.closest('[data-rx-submit]')){rxSave('sub');return}
 if(t.closest('[data-rx-draft]')){rxSave('draft');return}
 if(x=t.closest('[data-rx-open]')){rxOpen(x.dataset.rxOpen);return}
 if(x=t.closest('[data-rx-edit]')){rxEdit(x.dataset.rxEdit);return}
 if(x=t.closest('[data-rx-adv]')){rxAdv(x.dataset.rxAdv);return}
 if(x=t.closest('[data-rx-cancel]')){rxCancel(x.dataset.rxCancel);return}
 if(t.closest('[data-st-enter]')){ST.on=true;stRender();return}
 if(t.closest('[data-st-exit]')){ST.on=false;stRender();return}
 if(x=t.closest('[data-st-shop]')){ST.shop=+x.dataset.stShop;ST.tab='ov';history.replaceState(null,'','#/studio/'+ST.shop);stRender();return}
 if(x=t.closest('[data-st-tab]')){ST.tab=x.dataset.stTab;stRender();return}
 if(t.closest('[data-st-prev]')){stPrev();return}
 if(t.closest('[data-st-add]')){stProd();return}
 if(x=t.closest('[data-st-edit]')){stProd(x.dataset.stEdit);return}
 if(x=t.closest('[data-st-av]')){const p=stData(ST.shop).dr.ps.find(q=>q.id==x.dataset.stAv);if(p){p.a=!p.a;stRender()}return}
 if(x=t.closest('[data-st-del]')){stDel(x.dataset.stDel);return}
 if(x=t.closest('[data-st-a]')){ST.ed.a=x.dataset.stA=='1';x.parentNode.querySelectorAll('button').forEach(b=>{const on=b==x;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});return}
 if(t.closest('[data-st-pick]')){$('#spimg').click();return}
 if(t.closest('[data-st-imgrm]')){ST.ed.img=null;$('#spib').innerHTML=stImgBox();return}
 if(t.closest('[data-st-save]')){stSave();return}
 if(x=t.closest('[data-st-ban]')){stData(ST.shop).dr.ban=+x.dataset.stBan;stRender();return}
 if(x=t.closest('[data-st-lay]')){stData(ST.shop).dr.lay=x.dataset.stLay;stRender();return}
 if(x=t.closest('[data-st-adv]')){const b=stShop(),o=stOrd(b,stData(b.id)).find(q=>q.id==x.dataset.stAdv),k=Object.keys(ORS);if(o&&o.st!='done'){o.st=k[k.indexOf(o.st)+1];stRender()}return}
 if(t.closest('[data-st-apply]')){const d=stData(ST.shop);d.ap=xcl(d.dr);closeAll();stRender();toast('Applied to this demo session only — not saved or published');return}
 if(t.closest('[data-st-discard]')){const d=stData(ST.shop);d.dr=xcl(d.ap);closeAll();stRender();toast('Draft changes discarded');return}
});

/* ================= Dorkar polish: single home search, storefront helpers ================= */
let sOpen=false;
function setSearch(on){sOpen=on;const s_=$('#srch'),h=$('#hhome'),l=document.querySelector('.hero2 .search');if(!s_||!h)return;s_.hidden=!on;h.hidden=on;if(l)l.classList.toggle('sopen',on);if(on){const q=$('#q');fillRes(q?q.value:'')}}
function closeSearch(){const q=$('#q');if(q){q.value='';q.blur()}committed=false;setSearch(false)}
document.addEventListener('focusin',e=>{if(e.target.id=='q'&&!sOpen)setSearch(true)});
document.addEventListener('click',e=>{if(e.target.closest('[data-sgo]')){sOpen?closeSearch():$('#q').focus()}});
document.addEventListener('keydown',e=>{if(e.target.id=='q'&&e.key=='Escape')closeSearch()});
function srow(p){const b=by(p.bid);if(!b)return'';const ok=isOrderable(b);
 return `<div class="sr"><button class="po" data-prod="${p.id}" aria-label="${esc(p.n)}"><span class="th im" ${sty(b.c)}>${p.img?`<img src="${p.img}" alt="" class="cov-img" loading="lazy" onerror="this.remove()">`:''}<span class="sc">${scn(b.c)}</span></span></button></button><div class="srb"><button class="po" data-prod="${p.id}"><div class="pn">${esc(p.n)}</div></button><div class="pp">${p.p?price(p.p)+(p.sample?'<small>নমুনা</small>':''):'দাম জানা নেই'}</div><a class="shl" href="#/biz/${b.id}">${ic(b.c,13)}<b>${esc(b.n)}</b><span>· ${esc(b.l)}</span></a></div>${ok?`<button class="pa" data-add="${p.id}" aria-label="${esc(p.n)} কার্টে যোগ করুন">${ic('plus',18)}</button>`:'<span></span>'}</div>`}
const sfGroups=ps=>{const g=[];ps.forEach(p=>{if(p.g&&!g.includes(p.g))g.push(p.g)});return g};
function sfTile(p,b,on,ok){return `<div class="pt sfp" data-g="${esc(p.g||'')}"><div class="pw"><button class="po" data-prod="${p.id}" aria-label="${esc(p.n)}"><span class="pi im" ${sty(b.c)}>${p.img?`<img src="${p.img}" alt="" class="cov-img" loading="lazy" onerror="this.remove()">`:''}<span class="sc">${scn(b.c)}</span></span></button><button class="pf ${on?'on':''}" data-pfav="${p.id}" aria-label="সংরক্ষণ করুন" aria-pressed="${on}">${ic('heart',15)}</button></div><div class="spb"><button class="po" data-prod="${p.id}"><div class="pn">${esc(p.n)}</div></button><div class="spr"><div class="pp">${p.p?price(p.p)+(p.sample?'<small>নমুনা</small>':''):'দাম জানা নেই'}</div>${ok?`<button class="pa" data-add="${p.id}" aria-label="${esc(p.n)} কার্টে যোগ করুন">${ic('plus',18)}</button>`:''}</div></div></div>`}
function sfFilter(){const w=$('#spg');if(!w)return;const on=document.querySelector('.stc .on'),g=on?on.dataset.sfg:'',q=((($('#stq')||{}).value)||'').trim().toLowerCase();let n=0;
 w.querySelectorAll('.sfp').forEach(t=>{const nm=((t.querySelector('.pn')||{}).textContent||'').toLowerCase();const show=(!g||t.dataset.g==g)&&(!q||nm.includes(q));t.hidden=!show;if(show)n++});const e=$('#spe');if(e)e.hidden=n>0}
document.addEventListener('click',e=>{const x=e.target.closest('[data-sfg]');if(!x)return;const c=x.parentNode;c.querySelectorAll('button').forEach(b=>{const on=b==x;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});sfFilter();c.scrollTo({left:x.offsetLeft-c.clientWidth/2+x.offsetWidth/2,behavior:reduce()?'auto':'smooth'})});
document.addEventListener('input',e=>{if(e.target.id=='stq')sfFilter()});

/* ================= Build Your Own Combo (restaurant pages only; uses the existing cart) ================= */
const comboOK=b=>!!b&&b.c=='Restaurants'&&isOrderable(b)&&prods(b).length>=2;
const comboEntry=b=>`<button class="cbe" data-combo="${b.id}"><i>${ic('bag',22)}</i><span><b>Build Your Own Combo</b><small>${esc(b.n)}-এর মেনু থেকে নিজের কম্বো বানান</small></span>${ic('chev',18)}</button>`;
let CB={bid:null,sel:{},err:''};
const cbLines=()=>{const b=by(CB.bid);return Object.keys(CB.sel).map(id=>{const p=prodById(id);return p&&p.bid==CB.bid?{p,q:CB.sel[id].q,o:CB.sel[id].o}:null}).filter(Boolean)};
function openCombo(bid){const b=by(bid);if(!comboOK(b))return;CB={bid:b.id,sel:{},err:''};renderCombo();showLayer(sheet);sheet.classList.add('cb')}
function renderCombo(fk){const b=by(CB.bid);if(!b)return;const ps=prods(b),gs=sfGroups(ps),L=cbLines(),n=L.reduce((a,l)=>a+l.q,0),t=totals(L.map(l=>({p:l.p.p,q:l.q,sample:l.p.sample})));
 const tot=t.hasEst?price(t.est)+(t.all?'':'+'):'মেমো অনুযায়ী';
 const row=p=>{const q=(CB.sel[p.id]||{}).q||0;return `<div class="cbi ${q?'on':''}"><span class="th im" ${sty(b.c)}><span class="sc">${scn(b.c)}</span></span><div class="cbn"><div class="pn">${esc(p.n)}</div><div class="pp">${p.p?price(p.p)+(p.sample?'<small>নমুনা</small>':''):'দাম জানা নেই'}</div></div>${q?`<div class="qs" role="group" aria-label="${esc(p.n)} পরিমাণ"><button data-cbm="${p.id}" data-cbk="m:${p.id}" aria-label="কমান">${ic('minus',16)}</button><b aria-live="polite">${q}</b><button data-cbp="${p.id}" data-cbk="p:${p.id}" aria-label="বাড়ান">${ic('plus',16)}</button></div>`:`<button class="pa" data-cbp="${p.id}" data-cbk="p:${p.id}" aria-label="${esc(p.n)} যোগ করুন">${ic('plus',18)}</button>`}</div>`};
 const list=gs.length>1?gs.map(g=>`<div class="cbh">${esc(g)}</div>${ps.filter(p=>p.g==g).map(row).join('')}`).join('')+ps.filter(p=>!p.g).map(row).join(''):ps.map(row).join('');
 const sum=L.length?`${L.map(l=>`<div class="cbl"><div class="cbln"><b>${esc(l.p.n)}</b> <span class="sub">× ${l.q}</span>${(l.p.opts||[]).map(g=>`<div class="chs" role="radiogroup" aria-label="${esc(g.k)}">${g.v.map(v=>`<button role="radio" aria-checked="${l.o[g.k]==v}" class="${l.o[g.k]==v?'on':''}" data-cbo="${l.p.id}" data-k="${esc(g.k)}" data-v="${esc(v)}">${esc(g.k)}: ${esc(v)}</button>`).join('')}</div>`).join('')}</div><span class="cbp">${l.p.p!=null?price(l.p.p*l.q):'—'}</span><button class="rmb" data-cbr="${l.p.id}" aria-label="${esc(l.p.n)} সরিয়ে দিন">${ic('trash',16)}</button></div>`).join('')}<div class="sum"><div><span>সাবটোটাল (${n} টি)</span><b style="font-weight:500">${tot}</b></div><div class="t"><span>মোট</span><b>${tot}</b></div></div><p class="note" style="margin-top:8px">কম্বোর আলাদা ছাড় নেই — নির্বাচিত আইটেমের দামের যোগফল।${t.smp?' নমুনা মূল্য, প্রকৃত দাম মেমো অনুযায়ী।':''} ডেলিভারি চার্জ কার্টে যোগ হবে।</p>`
  :`<p class="cbz">উপরের মেনু থেকে আইটেম বেছে নিন — এখানে আপনার কম্বো দেখা যাবে।</p>`;
 const st=sheet.scrollTop;sheet.setAttribute('aria-label','Build Your Own Combo');
 sheet.innerHTML=`<div class="dh"><div style="flex:1;min-width:0"><b class="bn" style="font-size:17px;display:block">Build Your Own Combo</b><span class="sub">${esc(b.n)} · যত খুশি আইটেম যোগ করুন</span></div><button class="ib sm" data-close aria-label="বন্ধ">${ic('x',18)}</button></div>
 <div class="cbm">${list}</div><div class="cbs"><h3 class="bn">আপনার কম্বো</h3>${sum}</div>
 <div class="cbf"><div id="cberr" role="alert">${CB.err?`<div class="err">${ic('alert',16)}<span>${esc(CB.err)}</span></div>`:''}</div><div class="cbr"><div><small>মোট${n?' · '+n+' টি':''}</small><b>${n?tot:'৳0'}</b></div><button class="pill" data-cbadd data-cbk="add">${ic('cart',18)} কার্টে যোগ করুন</button></div></div>`;
 sheet.scrollTop=st;if(fk){const e=sheet.querySelector(`[data-cbk="${fk}"]`)||sheet.querySelector(`[data-cbk="p:${fk.slice(2)}"]`);e&&e.focus({preventScroll:true})}}
document.addEventListener('click',e=>{const t=e.target;let x;
 if(x=t.closest('[data-combo]')){openCombo(x.dataset.combo);return}
 if(!CB.bid||!openEl||openEl!==sheet||!sheet.classList.contains('cb'))return;
 const cap=(id,d)=>{const c=CB.sel[id];if(d>0){if(!c){const p=prodById(id);if(!p||p.bid!=CB.bid)return;const o={};(p.opts||[]).forEach(g=>o[g.k]=g.v[0]);CB.sel[id]={q:1,o}}else c.q=Math.min(99,c.q+1)}else if(c){c.q--;if(c.q<=0)delete CB.sel[id]}CB.err=''};
 if(x=t.closest('[data-cbp]')){const id=x.dataset.cbp;cap(id,1);renderCombo('p:'+id);return}
 if(x=t.closest('[data-cbm]')){const id=x.dataset.cbm;cap(id,-1);renderCombo('m:'+id);return}
 if(x=t.closest('[data-cbr]')){delete CB.sel[x.dataset.cbr];CB.err='';renderCombo();return}
 if(x=t.closest('[data-cbo]')){const c=CB.sel[x.dataset.cbo];if(c){c.o[x.dataset.k]=x.dataset.v;renderCombo()}return}
 if(x=t.closest('[data-cbadd]')){const L=cbLines();
  if(!L.length){CB.err='কম্বোতে এখনো কোনো আইটেম নেই — মেনু থেকে অন্তত একটি আইটেম বেছে নিন।';renderCombo();sheet.scrollTop=0;return}
  const bad=L.find(l=>(l.p.opts||[]).some(g=>!l.o[g.k]));if(bad){CB.err=bad.p.n+'-এর জন্য একটি পছন্দ বেছে নিন।';renderCombo();return}
  const b=by(CB.bid);if(!isOrderable(b)){CB.err='এই দোকানে এখন অনলাইন অর্ডার চালু নেই।';renderCombo();return}
  L.forEach(l=>addLine({bid:b.id,pid:l.p.id,n:l.p.n,q:l.q,o:{...l.o}}));const n=L.reduce((a,l)=>a+l.q,0);CB={bid:null,sel:{},err:''};
  closeAll(true);afterAdd(b,'কম্বো ('+n+' টি আইটেম)',x)}});

route();
</script>
