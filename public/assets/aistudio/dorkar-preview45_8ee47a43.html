<style>

.bact .give .bi{background:#fff1f4}.bact .give .bp{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff}
.bact button:active{transform:scale(.95)}
.bact button:focus-visible{outline:3px solid #fda4b5;outline-offset:2px}
@media(hover:hover){.bact button:hover{transform:translateY(-2px)}.bact .give:hover{background:#fff7f9;border-color:#f43f5e}}
@keyframes bpl{0%{box-shadow:0 0 0 0 #ffffffaa}70%,100%{box-shadow:0 0 0 10px #fff0}}

async function syncOrders(){const O=ld('dk-ord',[]),me=ld('dk-me',{}),ids=O.map(o=>o.id).filter(Boolean);if(!ids.length&&!me.p)return false;
  try{const r=await jpost('/api/orders/sync',{ids,phone:me.p||''}),j=await r.json();if(!j.success||!Array.isArray(j.data))return false;let ch=false;
   O.forEach(lo=>{const ro=j.data.find(r=>r.id===lo.id);if(!ro)return;const x=bxx(ro),s=Math.max(lo.st||0,bst(ro));
    if(!!lo.x!==x||(lo.st||0)!==s){if(x)lo.x=1;else delete lo.x;lo.st=s;ch=true}});
   if(ch)sv('dk-ord',O);return ch}catch(e){return false}}
async function pullStaff(){if(!adm)return false;const pw=ld('dk-adm-pass','');if(!pw)return false;
  try{const j=await jget('/api/orders',{'x-admin-pass':pw});if(!j.success||!Array.isArray(j.data))return false;
   const S2=ld('dk-staff',[]);let ch=false;
   j.data.forEach(r=>{const o=S2.find(x=>x.id==r.id),x=bxx(r),st=bst(r);
    if(!o){S2.push({id:r.id,t:r.timestamp||Date.parse(r.createdAt)||Date.now(),n:r.customerName,p:r.phone,a:r.address,g:(r.latitude!=null&&r.longitude!=null)?{lat:r.latitude,lng:r.longitude}:null,km:r.distanceKm,d:r.deliveryCharge||0,sub:r.subtotal||0,st,x:x?1:0,lines:(r.lines||[]).map(l=>({t:l.n,s:r.preferredStore||'',q:l.q,p:l.p||0,k:'z'}))});ch=true}
    else{const ns=Math.max(o.st||0,st);if(!!o.x!==x||(o.st||0)!==ns){o.x=x?1:0;o.st=ns;ch=true}}});
   if(ch){S2.sort((a,b)=>b.t-a.t);sv('dk-staff',S2.slice(0,60))}return ch}catch(e){return false}}
