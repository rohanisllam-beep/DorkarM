<style>

V.biz=function(id){const b=by(id);if(!b)return empty;const ps=prods(b),ok=isOrderable(b);
 return `<div class="det"><div class="hero">${img(b)}${backBtn}${fav(b)}</div><div class="info"><h1 class="bn" style="font-weight:600">${esc(b.n)}</h1><div class="sub" style="font-size:14px">${b.c} · ${esc(b.l)} ${b.r&&b.verified?` · <span class="rt" style="display:inline-flex">${ic('star',13)}${b.r}</span>`:''}</div>
 <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${b.verified===true?'':'<span class="tag">নমুনা তথ্য</span>'}<span class="tag ${ok?'ok':'no'}">${ok?ic('check',13)+'অর্ডার করা যায়':'অনলাইন অর্ডার চালু নেই'}</span></div>
 ${hoursLine(b)}
 <div class="acts">${b.phone?`<a class="act" href="tel:${esc(b.phone)}"><i>${ic('phone',22)}</i>Call</a>`:`<button class="act" disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed" title="ফোন নম্বর যোগ করা হয়নি"><i>${ic('phone',22)}</i>Call</button>`}<button class="act" data-go="#/map/${b.id}"><i style="--t:#E8E0FF">${ic('pin',22)}</i>Directions</button><button class="act" data-share="${b.id}"><i style="--t:#D8E8FF">${ic('share',22)}</i>Share</button></div>
 ${ok?`<div class="sec" style="margin-top:22px"><h2>${b.c=='Restaurants'||b.c=='Bakery'?'Menu':'Products'}</h2><span class="sub">+ চাপলে কার্টে যোগ হবে</span></div><div class="pg">${ps.map(p=>tile(p)).join('')}${customTile(b)}</div>${ps.length?'':`<p class="note" style="margin-top:12px">এই দোকানের পণ্য তালিকা এখনো যোগ করা হয়নি — “অন্য কিছু” দিয়ে নিজে লিখে অর্ডার করতে পারেন।</p>`}`
 :`<div class="empty" style="padding:30px 0"><i>${ic('info',26)}</i><div>এই ক্যাটাগরিতে এখন অনলাইন অর্ডার চালু নেই</div></div>`}
 ${ps.length&&ps.some(p=>p.sample)?`<p class="note">নমুনা মূল্য — প্রকৃত দাম দোকানের ক্যাশ মেমো অনুযায়ী। নমুনা তথ্য — প্রকৃত দোকানের তথ্য নয়।</p>`:`<p class="note">নমুনা তথ্য — প্রকৃত দোকানের তথ্য নয়</p>`}</div></div>`};
V.orders=function(){return `<div class="hd">${backBtn}<h1 class="bn" style="margin:0">আমার অর্ডার</h1></div>
 <div class="lk"><div class="fld"><label for="lkid">অর্ডার আইডি দিয়ে খুঁজুন</label><input id="lkid" placeholder="DKR-XXXXXX" autocapitalize="characters" autocomplete="off"></div><button class="pill" style="margin-top:21px" data-lookup>খুঁজুন</button></div>
 <div class="orw" id="ord" style="margin-top:14px"></div><p class="note">অর্ডারের তালিকা শুধু এই ডিভাইসে সংরক্ষিত।</p>`};
V.track=function(id){return `<div class="hd">${backBtn}<h1 class="bn" style="margin:0">অর্ডার ট্র্যাকিং</h1></div><div id="trk" aria-live="polite"></div>`};
const recentP=()=>{const L=rvp.map(prodById).filter(Boolean);return L.length?`<div class="sec"><h2>Recently viewed items</h2></div><div class="strip" style="--w:130px">${L.map(p=>tile(p,1)).join('')}</div>`:''};

/* ---------- search: suggestions, recent searches, filters ---------- */
let flt={c:'',ord:false,max:0},committed=false;
V.search=function(q=''){return `<h1>Search</h1><div class="sw">${sbox(q)}<div id="sg" class="sg" hidden role="listbox" aria-label="সাজেশন"></div></div><div id="fl" class="fl"></div><div id="res" style="margin-top:8px"></div>`};
const sgRow=(i,t,s,go)=>`<button role="option" ${go}><i ${sty(i)}>${ic(i,18)}</i><span class="t"><div>${esc(t)}</div><em>${esc(s)}</em></span></button>`;
function flRender(){const f=flt;$('#fl').innerHTML=`<button class="${!f.c&&!f.ord&&!f.max?'on':''}" data-fl="all">সব</button><button class="${f.ord?'on':''}" data-fl="ord" aria-pressed="${f.ord}">${ic('cart',14)} অর্ডার করা যায়</button>${[100,250].map(n=>`<button class="${f.max==n?'on':''}" data-fl="max" data-v="${n}" aria-pressed="${f.max==n}">পণ্য ≤ ${price(n)}</button>`).join('')}${CATS.map(c=>`<button class="${f.c==c?'on':''}" data-fl="c" data-v="${c}" aria-pressed="${f.c==c}">${c}</button>`).join('')}`}
function fillRes(q){const el=$('#res');if(!el)return;const t=q.trim().toLowerCase(),f=flt;flRender();
 const BL=B.filter(b=>(!t||(b.n+b.c+b.l).toLowerCase().includes(t))&&(!f.c||b.c==f.c)&&(!f.ord||isOrderable(b)));
 const PL=(t||f.max)?allP().filter(p=>{const b=by(p.bid);return(!t||(p.n+' '+b.n).toLowerCase().includes(t))&&(!f.c||b.c==f.c)&&(!f.ord||isOrderable(b))&&(!f.max||(p.p&&p.p<=f.max))}):[];
 let h='';if(!t&&rs.length)h+=`<div class="rsr"><span class="lbl">সাম্প্রতিক খোঁজ</span>${rs.map(x=>`<button class="c" data-rs="${esc(x)}">${esc(x)}</button>`).join('')}<button class="lnk" data-rs-clear>মুছে ফেলুন</button></div>`;
 if(PL.length)h+=`<div class="sub2">পণ্য</div><div class="pg w">${PL.slice(0,24).map(p=>tile(p,1)).join('')}</div>`;
 if(BL.length)h+=`${PL.length?'<div class="sub2">দোকান</div>':''}<div class="grid">${BL.map(b=>card(b)).join('')}</div>`;
 el.innerHTML=(BL.length||PL.length)?h:h+empty}
function sugg(q){const g=$('#sg');if(!g)return;const t=q.trim().toLowerCase();if(!t||committed){g.hidden=true;return}
 const bl=B.filter(b=>(b.n+b.c).toLowerCase().includes(t)).slice(0,3),pl=allP().filter(p=>(p.n.toLowerCase().includes(t))).slice(0,4);
 g.innerHTML=pl.map(p=>sgRow(by(p.bid).c,p.n,(p.p?price(p.p)+' · ':'')+by(p.bid).n,`data-sg-p="${p.id}"`)).join('')+bl.map(b=>sgRow(b.c,b.n,b.c+' · '+b.l,`data-sg-b="${b.id}"`)).join('');g.hidden=!(bl.length||pl.length)}
const commitRS=q=>{q=q.trim();if(q.length<2)return;rs=[q,...rs.filter(x=>x.toLowerCase()!=q.toLowerCase())].slice(0,8);ls.set('mz-rs',rs)};

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id=='q'){committed=false;sugg(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.target.id=='q'&&e.key=='Enter'){committed=true;commitRS(e.target.value);sugg('');e.target.blur?.()}});
document.addEventListener('click',e=>{const t=e.target;let x;
 if(!t.closest('.sw')){const g=$('#sg');if(g)g.hidden=true}
 if(x=t.closest('[data-close]')){closeAll();return}
 if(x=t.closest('[data-prod]')){openProd(x.dataset.prod);return}
 if(x=t.closest('[data-custom]')){openCustom(x.dataset.custom);return}
 if(x=t.closest('[data-add]')){const p=prodById(x.dataset.add);if(!p)return;if(p.opts){openProd(p.id);return}addLine({bid:p.bid,pid:p.id,n:p.n,q:1});x.classList.add('ok');x.innerHTML=ic('check',18);setTimeout(()=>{x.classList.remove('ok');x.innerHTML=ic('plus',18)},900);afterAdd(by(p.bid),p.n,x);return}
 if(x=t.closest('[data-pfav]')){const id=x.dataset.pfav;pfavs.has(id)?pfavs.delete(id):pfavs.add(id);ls.set('mz-pfav',[...pfavs]);document.querySelectorAll(`[data-pfav="${id}"]`).forEach(f=>{const on=pfavs.has(id);f.classList.toggle('on',on);f.setAttribute('aria-pressed',on);if(f.classList.contains('ib'))f.style.color=on?'var(--or)':''});if(location.hash=='#/favs'&&!openEl)setTimeout(route,300);return}
 if(x=t.closest('[data-opt]')){SS.o[x.dataset.opt]=x.dataset.val;x.parentNode.querySelectorAll('button').forEach(b=>{const on=b==x;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});return}
 if(x=t.closest('[data-qu],[data-qd]')){const up=x.hasAttribute('data-qu'),id=x.dataset.qu||x.dataset.qd;
  if(id=='s'){SS.q=Math.max(1,Math.min(99,SS.q+(up?1:-1)));x.parentNode.querySelector('b').textContent=SS.q}
  else{const l=cart.find(c=>c.k==id);if(l){l.q=Math.max(1,Math.min(99,l.q+(up?1:-1)));saveCart();const f=document.activeElement&&document.activeElement.dataset.qu?'qu':'qd';renderDrawer();const nb=dr.querySelector(`[data-${up?'qu':'qd'}="${CSS.escape(id)}"]`);nb&&nb.focus()}}return}
 if(x=t.closest('[data-sadd]')){const note=($('#snote').value||'').trim();if(SS.custom)return;const{p,q,o}=SS;addLine({bid:p.bid,pid:p.id,n:p.n,q,o:{...o},note});const from=x;closeAll(true);afterAdd(by(p.bid),p.n,from);return}
 if(x=t.closest('[data-cadd]')){const n=$('#cn').value.trim();if(n.length<2){$('#cne').textContent='কী আনতে হবে লিখুন';$('#cn').setAttribute('aria-invalid','true');$('#cn').focus();return}addLine({bid:SS.custom,n,q:SS.q});const from=x;closeAll(true);afterAdd(by(SS.custom),n,from);return}
 if(x=t.closest('[data-rm]')){cart=cart.filter(l=>l.k!=x.dataset.rm);saveCart();renderDrawer();return}
 if(x=t.closest('[data-checkout]')){startCheckout(x.dataset.checkout);return}
 if(x=t.closest('[data-cart-back]')){ui.v='cart';renderDrawer();return}
 if(x=t.closest('[data-addr]')){const a=prof.addrs[+x.dataset.addr];if(a){$('#caddr').value=a.t}return}
 if(x=t.closest('[data-gps]')){gps();return}
 if(x=t.closest('[data-place]')){place();return}
 if(x=t.closest('[data-copy]')){navigator.clipboard&&navigator.clipboard.writeText(x.dataset.copy).then(()=>toast('আইডি কপি হয়েছে'),()=>{});return}
 if(x=t.closest('[data-track]')){closeAll(true);location.hash='#/track/'+x.dataset.track;return}
 if(x=t.closest('[data-go-orders]')){closeAll(true);location.hash='#/orders';return}
 if(x=t.closest('[data-reorder]')){reorder(x.dataset.reorder);return}
 if(x=t.closest('[data-retry]')){startTrack(x.dataset.retry);return}
 if(x=t.closest('[data-lookup]')){const v=($('#lkid').value||'').trim().toUpperCase();if(v)location.hash='#/track/'+v;return}
 if(x=t.closest('[data-notif]')){Notification.requestPermission().then(p=>{x.remove();toast(p=='granted'?'পেজ খোলা থাকলে আপডেট জানানো হবে':'নোটিফিকেশন বন্ধ আছে')});return}
 if(x=t.closest('[data-share]')){const b=by(x.dataset.share),url=location.href.split('#')[0]+'#/biz/'+b.id;if(navigator.share)navigator.share({title:b.n,url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('লিংক কপি হয়েছে'));return}
 if(x=t.closest('[data-fl]')){const k=x.dataset.fl,v=x.dataset.v;if(k=='all')flt={c:'',ord:false,max:0};else if(k=='ord')flt.ord=!flt.ord;else if(k=='max')flt.max=flt.max==+v?0:+v;else flt.c=flt.c==v?'':v;fillRes($('#q').value);return}
 if(x=t.closest('[data-rs]')){const q=$('#q');q.value=x.dataset.rs;fillRes(q.value);q.focus();return}
 if(t.closest('[data-rs-clear]')){rs=[];ls.set('mz-rs',rs);fillRes($('#q').value);return}
 if(x=t.closest('[data-sg-p]')){commitRS($('#q').value);$('#sg').hidden=true;openProd(x.dataset.sgP);return}
 if(x=t.closest('[data-sg-b]')){commitRS($('#q').value);location.hash='#/biz/'+x.dataset.sgB;return}
 if(t.closest('[data-clear-gone]')){pfavs=new Set([...pfavs].filter(prodById));ls.set('mz-pfav',[...pfavs]);route();return}
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches&&e.target.matches('#cn')){e.preventDefault();$('[data-cadd]').click()}});
$('#cartBtn').addEventListener('click',()=>openCart());
$('#ordBtn').addEventListener('click',()=>{location.hash='#/orders'});
renderBadge();

document.addEventListener('input',e=>{const m={cname:'name',cphone:'phone',caddr:'addr'}[e.target.id];if(m){const er=$('#e-'+m);if(er)er.textContent='';e.target.removeAttribute('aria-invalid')}});

route();
</script>
</body>
</html>
