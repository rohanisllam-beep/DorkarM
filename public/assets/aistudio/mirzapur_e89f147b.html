<style>

 if(x=t.closest('[data-back]')){history.length>1?history.back():location.hash='#/explore';return}
 if(x=t.closest('[data-open]')){if(sel==+x.dataset.open){location.hash='#/biz/'+sel;return}}
 if(x=t.closest('[data-pin]')){sel=+x.dataset.pin;document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p.dataset.pin==sel));fillList(favTab,sel);return}
 if(x=t.closest('[data-tab]')){favTab=x.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b==x));fillList(favTab,sel);return}
 if(x=t.closest('[data-go]'))location.hash=x.dataset.go});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const x=e.target.closest('[data-go],[data-fav]');if(x&&e.target==x)x.click()}});
document.addEventListener('input',e=>{if(e.target.id=='q')fillRes(e.target.value)});
document.addEventListener('focusin',e=>{if(e.target.id=='q0')location.hash='#/search'});
route();
</script>
</body>
